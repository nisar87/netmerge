name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - name: A diagnostics report is accepted by the real database, and one with an unknown field is refused
        run: NETMERGE_REPORT_LIVE=1 go test -count=1 -run TestReportAcceptedByFirestore -v .
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -H=windowsgui" -o NetMerge.exe .
      - run: python3 scripts/check-windows-icon.py NetMerge.exe
  engine:
    # NetMerge's engine (engine/): its tests, the capture test (needs root: virtual adapter, network namespaces)
    # and everything NetMerge needs from it (engine_contract_test.go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: cd engine && gofmt -l . | (! grep .)
      - run: cd engine && go vet ./... && GOOS=windows go vet ./...
      - run: cd engine && go test -count=1 -v ./...
      - name: Capture test (root)
        run: cd engine && sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -count=1 -run TestTunEndToEnd -v .
      - run: cd engine && go build -o /tmp/nmengine ./cmd/nmengine
      - run: NM_ENGINE_BIN=/tmp/nmengine go test -count=1 -run TestEngineContract -v .
      - name: The same contract with NetMerge itself running as the engine (what the app's switch starts)
        run: go build -o /tmp/netmerge . && NM_ENGINE_BIN=/tmp/netmerge NM_ENGINE_ARGS=-engine go test -count=1 -run TestEngineContract -v .
  windows:
    # a real Windows machine (with administrator rights): the Windows-only parts of the app, and NetMerge's own
    # engine capturing real traffic through Wintun
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Get wintun.dll (checked against its published fingerprint)
        run: python scripts/get-wintun.py
      - run: go vet ./...
      - run: go test -count=1 -run "TestProcessesByPath|TestCounters64|TestUpdate|TestOfflineUsage|TestAdaptersAPIMatchesPowerShell|TestSysFacts" -v .
      - run: go build -o NetMerge.exe .
      - working-directory: engine
        run: go vet ./...
      - working-directory: engine
        run: go test -count=1 -v ./...
      - name: Capture test on Windows (Wintun)
        working-directory: engine
        env:
          NM_WIN_TUN_E2E: "1"
        run: go test -count=1 -run "TestTunWindows|TestIfIndexByName|TestFirewallRuleRecognised" -v .
  frontend:
    # the window's own tests: a fixture server that imitates NetMerge's API, driven by a real Chromium
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:fixtures
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: /tmp/netmerge-playwright-results-*
          retention-days: 7

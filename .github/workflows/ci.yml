name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -H=windowsgui" -o NetMerge.exe .
      - run: python3 scripts/check-windows-icon.py NetMerge.exe
  engine-contract:
    # everything NetMerge needs from its network engine (engine_contract_test.go), checked against a real engine.
    # mihomo is the engine NetMerge ships today (same version as enginedl.go); NetMerge's own engine (engine/) must
    # pass the same contract before it can be switched on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Get mihomo 1.19.33 (checked against its known fingerprint)
        run: |
          curl -sSL -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz
          echo "132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323  /tmp/mihomo.gz" | sha256sum -c
          gunzip -c /tmp/mihomo.gz > /tmp/mihomo && chmod +x /tmp/mihomo
      - run: NM_ENGINE_BIN=/tmp/mihomo go test -count=1 -run TestEngineContract -v .
  engine:
    # NetMerge's own engine (engine/): its tests, the capture test (needs root: virtual adapter, network namespaces)
    # and the same contract mihomo passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: cd engine && gofmt -l . | (! grep .)
      - run: cd engine && go vet ./... && GOOS=windows go vet ./...
      - run: cd engine && go test -count=1 -v ./...
      - name: Capture test (root)
        run: cd engine && sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -count=1 -run TestTunEndToEnd -v .
      - run: cd engine && go build -o /tmp/nmengine ./cmd/nmengine
      - run: NM_ENGINE_BIN=/tmp/nmengine go test -count=1 -run TestEngineContract -v .
  frontend:
    # the window's own tests: a fixture server that imitates NetMerge's API, driven by a real Chromium
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:fixtures
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: /tmp/netmerge-playwright-results-*
          retention-days: 7

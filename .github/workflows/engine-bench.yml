name: Engine benchmark
# NetMerge's engine measured the way NetMerge uses it (cmd/enginebench): start time, new connections, downloads,
# block accuracy, a line that silently stops answering, memory and CPU. A change is measured side by side with
# the engine on main, in turns, so the table shows whether it made things better or worse. The table is in the
# run's summary. Informational: it does not block anything.
on:
  workflow_dispatch:
  pull_request:
    paths: ["engine/**", ".github/workflows/engine-bench.yml"]
jobs:
  windows:
    # a Windows machine, over the internet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Get wintun.dll (checked against its published fingerprint)
        run: python scripts/get-wintun.py
      - name: Build this engine, the one on main, and the benchmark
        run: |
          git worktree add "$env:RUNNER_TEMP\main" origin/main
          Copy-Item -Recurse engine\wintun\amd64 "$env:RUNNER_TEMP\main\engine\wintun\" -Force
          Push-Location "$env:RUNNER_TEMP\main\engine"; go build -o "$env:RUNNER_TEMP\engine-main.exe" ./cmd/nmengine; Pop-Location
          Push-Location engine
          go build -o "$env:RUNNER_TEMP\engine-this.exe" ./cmd/nmengine
          go build -o "$env:RUNNER_TEMP\enginebench.exe" ./cmd/enginebench
          Pop-Location
      - name: Measure
        run: |
          $env:TEMP = $env:RUNNER_TEMP; $env:TMP = $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP\enginebench.exe" -rounds 5 -engine "main=$env:RUNNER_TEMP\engine-main.exe" -engine "this=$env:RUNNER_TEMP\engine-this.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-logs
          path: ${{ runner.temp }}/bench-*.log
          retention-days: 7
  local:
    # a private test network with its own servers (Linux, root): no internet noise, a 350,000-name block list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build this engine, the one on main, and the benchmark
        run: |
          git worktree add /tmp/main origin/main
          (cd /tmp/main/engine && go build -o /tmp/engine-main ./cmd/nmengine)
          cd engine && go build -o /tmp/engine-this ./cmd/nmengine && go build -o /tmp/enginebench ./cmd/enginebench
      - name: Measure
        run: cd /tmp && sudo -E ./enginebench -local -rounds 3 -engine main=/tmp/engine-main -engine this=/tmp/engine-this

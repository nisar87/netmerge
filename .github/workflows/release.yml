name: Release
# To publish a new version: change the number in the VERSION file, add a "## x.y.z" section to CHANGELOG.md and
# push to main. This workflow builds NetMerge.exe, publishes release vX.Y.Z (once per version) and every
# installed NetMerge finds it and offers the update. (Pushing a tag vX.Y.Z by hand works too.)
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Work out the version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; else VER="$(tr -d ' \r\n' < VERSION)"; fi
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          if gh release view "v${VER}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check
        if: steps.v.outputs.exists == 'false'
        run: |
          grep -q "appVersion = \"${{ steps.v.outputs.ver }}\"" update.go || { echo "update.go appVersion must equal VERSION"; exit 1; }
          go vet ./... && go test ./...
          node --test extension/core.test.js
      - name: Windows file details (product name and version)
        if: steps.v.outputs.exists == 'false'
        continue-on-error: true   # the exe is still built without the details if this step fails
        env:
          VER: ${{ steps.v.outputs.ver }}
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1
          MA="${VER%%.*}"; REST="${VER#*.}"; MI="${REST%%.*}"; PA="${REST#*.}"
          cat > versioninfo.json <<EOF
          {
            "FixedFileInfo": {
              "FileVersion": {"Major": ${MA}, "Minor": ${MI}, "Patch": ${PA}, "Build": 0},
              "ProductVersion": {"Major": ${MA}, "Minor": ${MI}, "Patch": ${PA}, "Build": 0}
            },
            "StringFileInfo": {
              "CompanyName": "NetMerge contributors",
              "FileDescription": "NetMerge - combine your internet connections",
              "FileVersion": "${VER}",
              "InternalName": "NetMerge",
              "LegalCopyright": "MIT License",
              "OriginalFilename": "NetMerge.exe",
              "ProductName": "NetMerge",
              "ProductVersion": "${VER}"
            }
          }
          EOF
          # Go accepts one .rsrc section: combine release details with the committed icon.
          # Replace only after success so a generator failure leaves the icon fallback intact.
          "$(go env GOPATH)/bin/goversioninfo" -64 -icon assets/windows/netmerge.ico -o netmerge_windows_amd64.syso.tmp versioninfo.json
          mv -f netmerge_windows_amd64.syso.tmp netmerge_windows_amd64.syso
          ls -l netmerge_windows_amd64.syso
      - name: Build
        if: steps.v.outputs.exists == 'false'
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.appVersion=${{ steps.v.outputs.ver }} -X main.updateRepo=${GITHUB_REPOSITORY}" -o NetMerge.exe .
          python3 scripts/check-windows-icon.py NetMerge.exe
          sha256sum NetMerge.exe > NetMerge.exe.sha256
          cat NetMerge.exe.sha256
      - name: Build the browser extension
        if: steps.v.outputs.exists == 'false'
        run: |
          python3 extension/build.py
          cp extension/dist/netmerge-chrome.zip NetMerge-extension-chrome-edge.zip
          cp extension/dist/netmerge-firefox.zip NetMerge-extension-firefox.zip
      - name: Release notes
        if: steps.v.outputs.exists == 'false'
        run: |
          awk -v v="${{ steps.v.outputs.ver }}" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Publish
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.ver }}" NetMerge.exe NetMerge.exe.sha256 NetMerge-extension-chrome-edge.zip NetMerge-extension-firefox.zip \
            --title "NetMerge ${{ steps.v.outputs.ver }}" --notes-file notes.md --target "${GITHUB_SHA}"

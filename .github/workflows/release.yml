name: Release
# Publish a release by pushing a tag such as v2.2.0. The app on everybody's PC finds it and offers the update.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          VER="${GITHUB_REF_NAME#v}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.appVersion=${VER} -X main.updateRepo=${GITHUB_REPOSITORY}" -o NetMerge.exe .
          sha256sum NetMerge.exe > NetMerge.exe.sha256
          cat NetMerge.exe.sha256
      - name: Release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" NetMerge.exe NetMerge.exe.sha256 --title "NetMerge ${GITHUB_REF_NAME#v}" --notes-file notes.md

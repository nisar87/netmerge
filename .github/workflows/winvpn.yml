name: Windows VPN helper (test)
# Builds the "NetMerge Windows VPN (test)" helper package (winvpn/): a Windows VPN plug-in that hands the PC's packets
# to NetMerge's engine instead of the Wintun adapter. It is signed with a test certificate made here; NetMerge trusts
# that certificate on the PC when the test is switched on. On main the package is published to the "winvpn-test"
# pre-release, where NetMerge downloads it (pre-releases are never offered as NetMerge updates).
on:
  push:
    branches: [main]
    paths: ["winvpn/**", ".github/workflows/winvpn.yml"]
  pull_request:
    paths: ["winvpn/**", ".github/workflows/winvpn.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Package version
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}.0"
          $m = "winvpn/NetMergeVpn/Package.appxmanifest"
          (Get-Content $m -Raw) -replace 'Version="1\.0\.0\.0"', "Version=`"$v`"" | Set-Content $m -NoNewline
          Select-String -Path $m -Pattern 'Identity'
      - name: Test signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=NetMerge Test" -KeyUsage DigitalSignature `
            -FriendlyName "NetMerge Test" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") -NotAfter (Get-Date).AddYears(3)
          $pw = ConvertTo-SecureString -String "netmerge-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath winvpn/NetMergeVpn/test.pfx -Password $pw | Out-Null
          New-Item -ItemType Directory -Force out | Out-Null
          Export-Certificate -Cert $cert -FilePath out/NetMergeVpnTest.cer | Out-Null
      - name: Build
        shell: pwsh
        run: |
          msbuild winvpn/NetMergeVpn.sln /restore /m /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:PackageCertificateKeyFile=test.pfx /p:PackageCertificatePassword=netmerge-test `
            /p:AppxPackageDir="$PWD\pkg\\" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse pkg | Select-Object FullName, Length | Format-Table -AutoSize
      - name: Bundle for NetMerge
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Recurse pkg -Include *.msix, *.appx | Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Select-Object -First 1
          if (-not $msix) { throw "no package built" }
          New-Item -ItemType Directory -Force out/deps | Out-Null
          Copy-Item $msix.FullName out/NetMergeVpn.msix
          $deps = Get-ChildItem -Recurse pkg -Include *.appx, *.msix | Where-Object { $_.FullName -match '\\Dependencies\\x64\\' }
          foreach ($d in $deps) { Copy-Item $d.FullName out/deps/ }
          Get-ChildItem -Recurse out | Select-Object FullName, Length | Format-Table -AutoSize
          Compress-Archive -Path out/* -DestinationPath NetMergeVpnTest.zip -Force
          (Get-FileHash NetMergeVpnTest.zip -Algorithm SHA256).Hash.ToLower() + "  NetMergeVpnTest.zip" | Set-Content NetMergeVpnTest.zip.sha256 -NoNewline
          Get-Content NetMergeVpnTest.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NetMergeVpnTest
          path: |
            NetMergeVpnTest.zip
            NetMergeVpnTest.zip.sha256
      - name: Publish to the winvpn-test pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view winvpn-test 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create winvpn-test --prerelease --title "Windows VPN helper (test)" `
              --notes "Helper package for NetMerge's Windows VPN test (Settings > How NetMerge catches traffic). NetMerge downloads it by itself; it is not an update of NetMerge." --target $env:GITHUB_SHA
          }
          gh release upload winvpn-test NetMergeVpnTest.zip NetMergeVpnTest.zip.sha256 --clobber
